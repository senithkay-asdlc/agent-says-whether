apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: rudeness-checker-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: agent-says-whether-rudeness-checker-agent
      name: http
      visibility: project
      envBindings:
        address: RUDENESS_CHECKER_AGENT_URL
  resources:
    - ref: agent-says-whethe-73a9f2d8
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
